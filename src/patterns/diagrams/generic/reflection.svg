<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320" role="img" aria-labelledby="reflection-title">
  <title id="reflection-title">Reflection: an actor attempts the task, an evaluator checks the attempt with tests or tools, and a failed attempt goes to a reflector that writes a short lesson into memory, which the actor reads on its next try, until an attempt passes or the attempt limit is reached.</title>
  <defs>
    <marker id="reflection-arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="arrowhead" d="M0 0 L10 5 L0 10 Z"/></marker>
    <marker id="reflection-arrow-main" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="arrowhead arrowhead--main" d="M0 0 L10 5 L0 10 Z"/></marker>
  </defs>

  <g class="node node--tool"><rect x="410" y="10" width="120" height="40" rx="8"/><text class="node-label" x="470" y="30">Tools</text></g>
  <g class="node node--io"><rect x="14" y="100" width="104" height="60" rx="8"/><text class="node-label" x="66" y="121">Task</text><text class="node-sub" x="66" y="141">+ success test</text></g>
  <g class="node node--agent"><rect x="160" y="90" width="140" height="80" rx="8"/><text class="node-label" x="230" y="120">Actor</text><text class="node-sub" x="230" y="142">attempt · act</text></g>
  <g class="node node--check"><rect x="400" y="90" width="140" height="80" rx="8"/><text class="node-label" x="470" y="120">Evaluator</text><text class="node-sub" x="470" y="142">tests · tools</text></g>
  <g class="node node--io"><rect x="580" y="100" width="92" height="60" rx="8"/><text class="node-label" x="626" y="121">Output</text><text class="node-sub" x="626" y="141">passed</text></g>
  <g class="node node--store"><rect x="160" y="210" width="140" height="60" rx="2"/><text class="node-label" x="230" y="231">Lessons</text><text class="node-sub" x="230" y="251">last few kept</text></g>
  <g class="node node--model"><rect x="400" y="210" width="140" height="60" rx="8"/><text class="node-label" x="470" y="231">Reflector</text><text class="node-sub" x="470" y="251">why it failed</text></g>

  <path class="edge edge--main" d="M118 130 H158" marker-end="url(#reflection-arrow-main)"/>
  <path class="edge edge--main" d="M300 130 H398" marker-end="url(#reflection-arrow-main)"/>
  <path class="edge edge--main" d="M540 130 H578" marker-end="url(#reflection-arrow-main)"/>
  <path class="edge" d="M470 50 V88" marker-end="url(#reflection-arrow)"/>
  <path class="edge edge--main" d="M470 170 V208" marker-end="url(#reflection-arrow-main)"/>
  <path class="edge edge--main" d="M400 240 H302" marker-end="url(#reflection-arrow-main)"/>
  <path class="edge edge--main" d="M230 210 V172" marker-end="url(#reflection-arrow-main)"/>

  <text class="edge-label" x="349" y="118">attempt</text>
  <text class="edge-label" x="559" y="116">pass</text>
  <text class="edge-label" x="490" y="194">fail</text>
  <text class="edge-label" x="350" y="230">lesson</text>
  <text class="edge-label" x="284" y="194">next try</text>
  <text class="edge-label" x="350" y="300">stops after N attempts and escalates</text>
</svg>
