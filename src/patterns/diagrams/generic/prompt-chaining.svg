<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 200" role="img" aria-labelledby="prompt-chaining-title">
  <title id="prompt-chaining-title">Prompt chaining: an input passes through three model calls in a fixed order, with a code check after the first call that stops the chain early if the output is invalid.</title>
  <defs>
    <marker id="prompt-chaining-arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="arrowhead" d="M0 0 L10 5 L0 10 Z"/></marker>
    <marker id="prompt-chaining-arrow-main" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="arrowhead arrowhead--main" d="M0 0 L10 5 L0 10 Z"/></marker>
  </defs>

  <g class="node node--io"><rect x="14" y="50" width="92" height="60" rx="8"/><text class="node-label" x="60" y="71">Input</text><text class="node-sub" x="60" y="91">request</text></g>
  <g class="node node--model"><rect x="134" y="50" width="92" height="60" rx="8"/><text class="node-label" x="180" y="71">Step 1</text><text class="node-sub" x="180" y="91">outline</text></g>
  <g class="node node--check"><rect x="254" y="50" width="92" height="60" rx="8"/><text class="node-label" x="300" y="71">Gate</text><text class="node-sub" x="300" y="91">valid?</text></g>
  <g class="node node--model"><rect x="374" y="50" width="92" height="60" rx="8"/><text class="node-label" x="420" y="71">Step 2</text><text class="node-sub" x="420" y="91">draft</text></g>
  <g class="node node--model"><rect x="494" y="50" width="92" height="60" rx="8"/><text class="node-label" x="540" y="71">Step 3</text><text class="node-sub" x="540" y="91">polish</text></g>
  <g class="node node--io"><rect x="614" y="50" width="92" height="60" rx="8"/><text class="node-label" x="660" y="71">Output</text><text class="node-sub" x="660" y="91">result</text></g>
  <g class="node node--io"><rect x="254" y="150" width="92" height="40" rx="8"/><text class="node-label" x="300" y="170">Stop early</text></g>

  <path class="edge edge--main" d="M106 80 H132" marker-end="url(#prompt-chaining-arrow-main)"/>
  <path class="edge edge--main" d="M226 80 H252" marker-end="url(#prompt-chaining-arrow-main)"/>
  <path class="edge edge--main" d="M346 80 H372" marker-end="url(#prompt-chaining-arrow-main)"/>
  <path class="edge edge--main" d="M466 80 H492" marker-end="url(#prompt-chaining-arrow-main)"/>
  <path class="edge edge--main" d="M586 80 H612" marker-end="url(#prompt-chaining-arrow-main)"/>
  <path class="edge edge--optional" d="M300 110 V148" marker-end="url(#prompt-chaining-arrow)"/>

  <text class="edge-label" x="360" y="40">pass</text>
  <text class="edge-label" x="322" y="130">fail</text>
</svg>
